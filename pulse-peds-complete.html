<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE · Paediatrics — Marrow Edition 8 Companion</title>
<style>
  :root{
    --bg:#120d1a; --card:#221a30; --card2:#2b2139; --line:#3a2d52;
    --txt:#f4eefb; --mut:#a89bbd; --pink:#e0607e; --gold:#c99a4b;
    --teal:#5fd0b5; --good:#3ddc84; --bad:#ff5d6c; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh;}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 60px;}
  header.top{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;
    padding:14px 16px; background:#120d1af2; border-bottom:1px solid var(--line); max-width:560px; margin:0 auto;}
  header.top .brand{font-weight:800; font-size:20px; letter-spacing:.3px; flex:1;}
  header.top .back{font-size:22px; cursor:pointer; color:var(--mut); padding:2px 8px 2px 0;}
  .hstat{font-weight:800; font-size:15px; white-space:nowrap;}
  .hidden{display:none !important;}
  .hero{background:linear-gradient(160deg,#3a2547,#221a30 70%); border:1px solid var(--line);
    border-radius:22px; padding:26px 22px; margin:16px 0;}
  .hero .kick{font-size:12px; letter-spacing:2.5px; color:var(--mut);}
  .hero h1{font-family:var(--serif); font-size:42px; margin:8px 0 10px; line-height:1.05;}
  .hero p{color:#cbbfe0; font-size:15px; line-height:1.55; margin:0 0 12px;}
  .hero a{color:var(--pink); font-weight:700; text-decoration:none; font-size:15px; cursor:pointer;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 6px; text-align:center;}
  .stat b{font-size:22px; display:block;} .stat span{font-size:12px; color:var(--mut);}
  .btn{display:block; width:100%; margin-top:12px; padding:15px; font-size:16px; font-weight:700;
    color:#1a0f14; background:linear-gradient(135deg,#f0788f,var(--pink)); border:0; border-radius:14px; cursor:pointer;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent; color:var(--txt); border:1.5px solid var(--line);}
  .btn.gold{background:linear-gradient(135deg,#e0b45f,var(--gold)); color:#1d1405;}
  h2.page{font-family:var(--serif); font-size:30px; margin:18px 0 2px;}
  p.sub{color:var(--mut); margin:0 0 14px; font-size:14px;}
  .chrow{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:14px; margin:10px 0; cursor:pointer;}
  .chrow.locked{opacity:.45; cursor:default;}
  .chnum{min-width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
    font-weight:800; font-size:17px; background:linear-gradient(135deg,#d96a84,#b34a62); color:#fff;}
  .chrow.locked .chnum{background:#3a2f4d; color:var(--mut);}
  .chrow .t{flex:1; font-weight:700; font-size:15.5px; line-height:1.35;}
  .chrow .u{font-size:12.5px; color:var(--teal); white-space:nowrap; font-weight:700;}
  .chrow.locked .u{color:var(--mut);}
  .pathsec{text-align:center; color:var(--mut); font-size:12px; letter-spacing:2.5px; margin:26px 0 6px;
    display:flex; align-items:center; gap:10px;}
  .pathsec::before,.pathsec::after{content:""; flex:1; height:1px; background:var(--line);}
  .node{display:flex; flex-direction:column; align-items:center; position:relative; padding:10px 0 4px;}
  .node:not(:last-child)::after{content:""; width:3px; height:26px; margin-top:10px; border-radius:2px;
    background:repeating-linear-gradient(180deg,var(--line) 0 5px,transparent 5px 10px);}
  .ball{width:86px; height:86px; border-radius:50%; display:grid; place-items:center;
    font-size:30px; font-weight:800; cursor:pointer; border:4px solid transparent;}
  .ball.done{background:#1d3a2a; border-color:var(--good); color:var(--good); font-size:32px;}
  .ball.current{background:radial-gradient(circle at 35% 30%,#e0b45f,var(--gold) 70%);
    color:#fff; box-shadow:0 0 0 6px #c99a4b33, 0 8px 24px #c99a4b55; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 6px #c99a4b33;}50%{box-shadow:0 0 0 11px #c99a4b22;}}
  .ball.locked{background:#241c33; border-color:#171224; color:#6f6386; cursor:default; font-size:30px;}
  .ntitle{margin-top:8px; font-weight:700; font-size:14.5px; text-align:center; max-width:230px; line-height:1.35;}
  .ncount{font-size:12px; color:var(--mut); margin-top:2px;}
  .guide{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; margin-top:16px;}
  .guide .kick{font-size:12px; letter-spacing:2px; color:var(--gold); font-weight:800;}
  .guide h2{font-family:var(--serif); font-size:26px; margin:8px 0 10px; line-height:1.25;}
  .guide p{color:#d8cde9; line-height:1.65; font-size:15.5px;}
  .qbar{height:10px; background:var(--card2); border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:16px 0 14px;}
  .qbar i{display:block; height:100%; width:0; background:var(--pink); transition:width .3s;}
  .qcount{font-size:12px; letter-spacing:2px; color:var(--mut); font-weight:700;}
  .qtag{display:inline-block; font-size:11.5px; color:var(--teal); border:1px solid #5fd0b555;
    border-radius:999px; padding:3px 10px; margin-top:8px;}
  .qtext{font-family:var(--serif); font-size:25px; line-height:1.35; margin:10px 0 16px;}
  .opt{display:block; width:100%; text-align:left; margin:10px 0; padding:16px; font-size:16px;
    color:var(--txt); background:var(--card); border:1.5px solid var(--line); border-radius:16px; cursor:pointer; line-height:1.4;}
  .opt:not(:disabled):active{border-color:var(--pink);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--good); background:#3ddc841c;}
  .opt.wrong{border-color:var(--bad); background:#ff5d6c1c;}
  .fb{margin-top:12px; padding:14px 15px; border-radius:14px; font-size:14.5px; line-height:1.6; display:none;}
  .fb.show{display:block;}
  .fb.good{background:#3ddc8412; border:1px solid #3ddc8466;}
  .fb.bad{background:#ff5d6c12; border:1px solid #ff5d6c66;}
  .donebox{text-align:center; padding:30px 10px;}
  .donebox .big{font-size:64px;}
  .donebox h2{font-family:var(--serif); font-size:30px; margin:10px 0 4px;}
  .rev{margin:8px 0; padding:11px 13px; border:1px solid var(--line); border-radius:12px;
    font-size:13.5px; background:var(--card); line-height:1.5; text-align:left;}
  .rev b{color:var(--good);}
  footer{text-align:center; color:var(--mut); font-size:12px; margin-top:22px; line-height:1.7;}
  .float{position:fixed; font-weight:800; pointer-events:none; animation:rise 1s ease-out forwards; z-index:50;}
  @keyframes rise{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-46px);}}
</style>
</head>
<body>
<header class="top">
  <span class="back hidden" id="backBtn" onclick="goBack()">‹</span>
  <span class="brand" id="brand">PULSE</span>
  <span class="hstat">🔥 <span id="hStreak">0</span></span>
  <span class="hstat">✦ <span id="hXP">0</span></span>
</header>
<div class="wrap">

  <!-- HOME -->
  <div id="home">
    <div class="hero">
      <div class="kick">MARROW EDITION 8 · COMPANION</div>
      <h1>Paediatrics</h1>
      <p id="heroSub"></p>
      <a onclick="show('chapters')">Browse chapters →</a>
    </div>
    <div class="stats">
      <div class="stat"><b id="sXP">0</b><span>Total XP</span></div>
      <div class="stat"><b id="sStreak">0</b><span>Day streak</span></div>
      <div class="stat"><b id="sUnits">0</b><span>Units done</span></div>
    </div>
    <button class="btn ghost" onclick="unlockAll()">🔓 Unlock all units (testing)</button>
    <button class="btn" onclick="continueLearning()">▶ Continue learning</button>
  </div>

  <!-- CHAPTERS -->
  <div id="chapters" class="hidden">
    <h2 class="page">Chapters</h2>
    <p class="sub" id="chSub"></p>
    <div id="chList"></div>
  </div>

  <!-- PATH -->
  <div id="path" class="hidden">
    <p class="sub" id="pathKick" style="margin-top:16px;"></p>
    <h2 class="page" id="pathTitle" style="margin-top:0;"></h2>
    <p class="sub" id="pathSub"></p>
    <div id="nodes"></div>
  </div>

  <!-- GUIDE -->
  <div id="guide" class="hidden">
    <div class="guide">
      <div class="kick" id="gKick"></div>
      <h2 id="gTitle"></h2>
      <p id="gText"></p>
      <p class="sub" id="gCount"></p>
      <button class="btn gold" onclick="beginUnit()">Start unit →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="qbar"><i id="qbar"></i></div>
    <div class="qcount" id="qcount"></div>
    <div><span class="qtag" id="qtag"></span></div>
    <div class="qtext" id="qtext"></div>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hidden" id="nextBtn" onclick="nextQ()">Continue →</button>
  </div>

  <!-- UNIT DONE -->
  <div id="unitdone" class="hidden">
    <div class="donebox">
      <div class="big">🎉</div>
      <h2>Unit complete!</h2>
      <p class="sub" id="dSub"></p>
      <div class="stats">
        <div class="stat"><b id="dScore">–</b><span>Score</span></div>
        <div class="stat"><b id="dXP">–</b><span>XP earned</span></div>
        <div class="stat"><b id="dAcc">–</b><span>Accuracy</span></div>
      </div>
      <div id="dRev"></div>
      <button class="btn" onclick="afterUnit()">Continue →</button>
      <button class="btn ghost" onclick="openGuide(curUnit)">↻ Redo unit</button>
    </div>
  </div>

  <footer>PULSE · Paediatrics · question order follows the book line-by-line<br>options shuffled every run · progress saved on this device</footer>
</div>

<script>
const QUESTIONS = [{"id":"PEDS-C1-001","sec":"Definitions","page":2,"q":"The newborn period extends up to —","opts":["First 2 weeks","First 4 weeks","First 6 weeks","First 12 weeks"],"ans":1,"exp":"Newborn period = first 4 weeks after birth. (Book p2)"},{"id":"PEDS-C1-002","sec":"Definitions","page":2,"q":"In the newborn period, the 'late' phase comprises —","opts":["Next 3 weeks","Next 6 weeks","Next 12 weeks","Next 6 months"],"ans":0,"exp":"1st week: Early; next 3 weeks: Late. (Book p2)"},{"id":"PEDS-C1-003","sec":"Definitions","page":2,"q":"Low birth weight (LBW) is defined as a birth weight less than —","opts":["2.0 kg","2.5 kg","3.0 kg","3.5 kg"],"ans":1,"exp":"Low birth weight (LBW): < 2.5 kg. (Book p2)"},{"id":"PEDS-C1-004","sec":"Definitions","page":2,"q":"Very low birth weight (VLBW) is defined as —","opts":["< 1.0 kg","< 1.5 kg","< 2.0 kg","< 2.5 kg"],"ans":1,"exp":"Very Low Birth Weight (VLBW): < 1.5 kg. (Book p2)"},{"id":"PEDS-C1-005","sec":"Definitions","page":2,"q":"Extremely low birth weight (ELBW) is a birth weight of —","opts":["< 500 g","< 1 kg","< 1.5 kg","< 2 kg"],"ans":1,"exp":"Extremely Low Birth Weight (ELBW): < 1 kg. (Book p2)"},{"id":"PEDS-C1-006","sec":"Definitions","page":2,"q":"A baby weighing 1.8 kg at birth is best classified as —","opts":["VLBW","LBW only","ELBW","Normal birth weight"],"ans":1,"exp":"1.8 kg is < 2.5 kg so LBW, but > 1.5 kg so not VLBW. (Book p2)"},{"id":"PEDS-C1-007","sec":"IUGR","page":2,"q":"In the book's classification, small-for-gestational-age (SGA) is divided into —","opts":["Constitutional (Normal) and Pathological (IUGR)","Early and Late","Symmetrical and Asymmetrical only","Acute and Chronic"],"ans":0,"exp":"SGA -> Constitutional (Normal) / Pathological (IUGR). (Book p2)"},{"id":"PEDS-C1-008","sec":"IUGR","page":2,"q":"The pathological form of SGA is —","opts":["IUGR","Constitutional SGA","LGA","Macrosomia"],"ans":0,"exp":"SGA: constitutional (normal) vs pathological (IUGR). (Book p2)"},{"id":"PEDS-C1-009","sec":"IUGR","page":2,"q":"Which of the following is an identification point of IUGR?","opts":["Loose skin folds","Plump subcutaneous fat","Thick umbilical cord","Large body size"],"ans":0,"exp":"Identification points: loose skin folds, skin peeling, thin umbilical cord. (Book p2)"},{"id":"PEDS-C1-010","sec":"IUGR","page":2,"q":"Skin peeling in a newborn is an identification point of —","opts":["IUGR / SGA","Macrosomia","Gestational diabetes","Normal term neonate"],"ans":0,"exp":"Identification points of IUGR include skin peeling. (Book p2)"},{"id":"PEDS-C1-011","sec":"IUGR","page":2,"q":"A thin umbilical cord is characteristic of —","opts":["IUGR baby","Term normal baby","Diabetic baby","Post-term baby"],"ans":0,"exp":"Identification points: a. Loose skin folds, b. Skin peeling, c. Thin umbilical cord. (Book p2)"},{"id":"PEDS-C1-012","sec":"IUGR Types","page":2,"q":"Maternal etiology (uteroplacental insufficiency) typically causes —","opts":["Symmetrical IUGR","Asymmetrical IUGR","LGA","Macrosomia"],"ans":0,"exp":"Symmetrical IUGR: etiology maternal, cause uteroplacental insufficiency. (Book p2)"},{"id":"PEDS-C1-013","sec":"IUGR Types","page":2,"q":"Uteroplacental insufficiency is the cause of —","opts":["Symmetrical IUGR","Asymmetrical IUGR","LGA","Constitutional SGA"],"ans":0,"exp":"Symmetrical IUGR cause: uteroplacental insufficiency. (Book p2)"},{"id":"PEDS-C1-014","sec":"IUGR Types","page":2,"q":"Asymmetrical IUGR has a — etiology.","opts":["Fetal","Maternal","Uteroplacental","Placental"],"ans":0,"exp":"Asymmetrical IUGR: etiology fetal (genetic defects, organ anomalies). (Book p2)"},{"id":"PEDS-C1-015","sec":"IUGR Types","page":2,"q":"Genetic defects (eg: Trisomy) and organ anomalies cause —","opts":["Asymmetrical IUGR","Symmetrical IUGR","LGA","Constitutional SGA"],"ans":0,"exp":"Asymmetrical IUGR cause: genetic defects (eg: Trisomy), organ anomalies. (Book p2)"},{"id":"PEDS-C1-016","sec":"IUGR Types","page":2,"q":"Asymmetrical IUGR begins in which trimester?","opts":["1st trimester","2nd trimester","3rd trimester","Perinatal period"],"ans":0,"exp":"Asymmetrical IUGR onset: 1st trimester. (Book p2)"},{"id":"PEDS-C1-017","sec":"IUGR Types","page":2,"q":"Symmetrical IUGR develops in the 2nd and 3rd trimester, i.e. during —","opts":["Placenta-dependent growth of body","Rapid fat deposition","Neurulation","Bone mineralisation"],"ans":0,"exp":"Symmetrical IUGR onset: 2nd and 3rd trimester (during placenta-dependent growth of body). (Book p2)"},{"id":"PEDS-C1-018","sec":"IUGR Types","page":2,"q":"A brain-sparing effect with normal-sized head and body small for gestational age is seen in —","opts":["Symmetrical IUGR","Asymmetrical IUGR","LGA","Normal growth"],"ans":0,"exp":"Symmetrical IUGR: brain-sparing effect present -> normal size head, body size small for gestational age. (Book p2)"},{"id":"PEDS-C1-019","sec":"IUGR Types","page":2,"q":"In asymmetrical IUGR, there is no brain-sparing effect, so the baby is —","opts":["Uniformly small","Larger than expected","Head large, body small","Normal size"],"ans":0,"exp":"Asymmetrical IUGR: no brain-sparing effect -> uniformly small baby. (Book p2)"},{"id":"PEDS-C1-020","sec":"IUGR Types","page":2,"q":"Which type of IUGR has a poor outcome?","opts":["Asymmetrical","Symmetrical","Constitutional","Both equally"],"ans":0,"exp":"Outcome: symmetrical = good, asymmetrical = poor. (Book p2)"},{"id":"PEDS-C1-021","sec":"Assessment of IUGR","page":2,"q":"On the new AIMS intrauterine growth curves, LGA lies on the —","opts":["Upper percentile curve","Lower percentile curve","Median curve","10th percentile"],"ans":0,"exp":"New AIMS curves: LGA -> upper percentile curve. (Book p2)"},{"id":"PEDS-C1-022","sec":"Assessment of IUGR","page":2,"q":"On the new AIMS intrauterine growth curves, SGA lies on the —","opts":["Lower percentile curve","Upper percentile curve","Median curve","90th percentile"],"ans":0,"exp":"New AIMS curves: SGA -> lower percentile curve. (Book p2)"},{"id":"PEDS-C1-023","sec":"Assessment of IUGR","page":2,"q":"A key feature of the new AIMS intrauterine growth curves is that —","opts":["Male and female charts are different","One chart fits all fetuses","They are used only after 40 weeks","They measure head circumference"],"ans":0,"exp":"Male and female charts are different. (Book p2)"},{"id":"PEDS-C1-024","sec":"Assessment of IUGR","page":2,"q":"Ponderal index (PI) is calculated as —","opts":["Weight of baby (g) / [Length of baby (cm)] cubed x 100","Weight (kg) / Height (m) squared","Weight / gestational age (weeks)","Length / weight x 100"],"ans":0,"exp":"PI = weight of baby (g) / [length of baby (cm)]^3 x 100. (Book p2)"},{"id":"PEDS-C1-025","sec":"Assessment of IUGR","page":2,"q":"A ponderal index greater than 2 indicates —","opts":["Symmetrical IUGR","Asymmetrical IUGR","LGA","Normal growth"],"ans":0,"exp":"PI interpretation: > 2 : Symmetrical IUGR. (Book p2)"},{"id":"PEDS-C1-026","sec":"Assessment of IUGR","page":2,"q":"A ponderal index less than 2 indicates —","opts":["Asymmetrical IUGR","Symmetrical IUGR","LGA","Constitutional SGA"],"ans":0,"exp":"PI interpretation: < 2 : Asymmetrical IUGR. (Book p2)"},{"id":"PEDS-C1-027","sec":"Preterm Baby","page":3,"q":"A preterm baby is one born before —","opts":["37 weeks","36 weeks","38 weeks","40 weeks"],"ans":0,"exp":"Pre-term: < 37 wks. (Book p3)"},{"id":"PEDS-C1-028","sec":"Preterm Baby","page":3,"q":"Term gestation spans —","opts":["37-41 weeks","36-40 weeks","38-42 weeks","34-36 weeks"],"ans":0,"exp":"Term: 37-41 wks. (Book p3)"},{"id":"PEDS-C1-029","sec":"Preterm Baby","page":3,"q":"A post-term baby is born at —","opts":["42 wks onwards","39 wks onwards","40 wks onwards","44 wks onwards"],"ans":0,"exp":"Post-term: 42 wks onwards. (Book p3)"},{"id":"PEDS-C1-030","sec":"Preterm Baby","page":3,"q":"Antenatal assessment of gestation is based on —","opts":["Mother's LMP and 1st trimester ultrasound scan","3rd trimester ultrasound and CTG","Fundal height only","Maternal weight gain"],"ans":0,"e const UNITS = [{"id":"PEDS-U001","ch":1,"n":1,"title":"Newborn Period & Birth Weights","sec":"Definitions · p2","guide":"Newborn period = first 4 weeks: 1st week is early, next 3 weeks are late. Birth weight categories: LBW < 2.5 kg, VLBW < 1.5 kg, ELBW < 1 kg. (Book p2)","qs":["PEDS-C1-001","PEDS-C1-002","PEDS-C1-003","PEDS-C1-004","PEDS-C1-005","PEDS-C1-006"]},{"id":"PEDS-U002","ch":1,"n":2,"title":"SGA & IUGR: Identification","sec":"Intrauterine Growth Retardation · p2","guide":"SGA can be constitutional (normal) or pathological (IUGR). Identification points of IUGR: loose skin folds, skin peeling, thin umbilical cord. (Book p2)","qs":["PEDS-C1-007","PEDS-C1-008","PEDS-C1-009","PEDS-C1-010","PEDS-C1-011"]},{"id":"PEDS-U003","ch":1,"n":3,"title":"Symmetrical vs Asymmetrical IUGR","sec":"IUGR Types · p2","guide":"Symmetrical: maternal etiology (uteroplacental insufficiency), onset 2nd-3rd trimester, brain-sparing present (normal head, small body), good outcome. Asymmetrical: fetal etiology (trisomy, organ anomalies), onset 1st trimester, no brain-sparing (uniformly small), poor outcome. (Book p2)","qs":["PEDS-C1-012","PEDS-C1-013","PEDS-C1-014","PEDS-C1-015","PEDS-C1-016","PEDS-C1-017","PEDS-C1-018","PEDS-C1-019","PEDS-C1-020"]},{"id":"PEDS-U004","ch":1,"n":4,"title":"Assessment of IUGR","sec":"Assessment of IUGR · p2","guide":"New AIMS intrauterine growth curves: LGA = upper percentile curve, SGA = lower percentile curve; male and female charts are different. Ponderal index (PI) = weight (g) / [length (cm)] cubed x 100: >2 = symmetrical IUGR, <2 = asymmetrical IUGR. (Book p2)","qs":["PEDS-C1-021","PEDS-C1-022","PEDS-C1-023","PEDS-C1-024","PEDS-C1-025","PEDS-C1-026"]},{"id":"PEDS-U005","ch":1,"n":5,"title":"Preterm Baby: Classification & Antenatal","sec":"Preterm Baby · p3","guide":"Preterm < 37 wks, term 37-41 wks, post-term 42 wks onwards. Antenatal assessment of gestation is based on mother's LMP and 1st trimester ultrasound scan. (Book p3)","qs":["PEDS-C1-027","PEDS-C1-028","PEDS-C1-029","PEDS-C1-030","PEDS-C1-031"]},{"id":"PEDS-U006","ch":1,"n":6,"title":"ENBS & Physical Maturity","sec":"Post Natal Assessment · p3","guide":"Expanded New Ballard Score (ENBS) is postnatal, based on neuromuscular maturity + physical maturity. Total range -10 to +50 (-10 = 20 wks, +50 = 44 wks), accuracy +/-1 week. Physical maturity: each sign scored -1 to +5, and scores map to gestation (0 = 24 wks, 10 = 28 wks, 30 = 36 wks, 45 = 42 wks). (Book p3)","qs":["PEDS-C1-032","PEDS-C1-033","PEDS-C1-034","PEDS-C1-035","PEDS-C1-036","PEDS-C1-037","PEDS-C1-038","PEDS-C1-039","PEDS-C1-040","PEDS-C1-041","PEDS-C1-042","PEDS-C1-043","PEDS-C1-044","PEDS-C1-045","PEDS-C1-046","PEDS-C1-047","PEDS-C1-048","PEDS-C1-049","PEDS-C1-050"]},{"id":"PEDS-U007","ch":1,"n":7,"title":"Preterm vs Term: 11 Differences","sec":"Differences Preterm & Term · p4","guide":"Preterm: extended posture, square window negative, no arm recoil, scarf sign positive (elbow crosses midline), obtuse popliteal angle, heel reaches ear, breast buds <5 mm, labia minora visible, empty scrotum, abundant lanugo, slow pinna recoil. Term: the opposite of all; testes fully descended by 36 wks. (Book p4)","qs":["PEDS-C1-051","PEDS-C1-052","PEDS-C1-053","PEDS-C1-054","PEDS-C1-055","PEDS-C1-056","PEDS-C1-057","PEDS-C1-058","PEDS-C1-059","PEDS-C1-060","PEDS-C1-061","PEDS-C1-062","PEDS-C1-063","PEDS-C1-064"]},{"id":"PEDS-U008","ch":1,"n":8,"title":"Complications of Preterm Birth","sec":"Complications of Preterm Birth · p4","guide":"Organ immaturity causes RDS (surfactant deficiency), NEC, IVH (germinal matrix bleeding into ventricles) and kernicterus (bilirubin crosses immature BBB -> brain damage). Decreased nutrient reserve causes hypoglycemia, anemia (low iron stores) and hypothermia. (Book p4)","qs":["PEDS-C1-065","PEDS-C1-066","PEDS-C1-067","PEDS-C1-068","PEDS-C1-069","PEDS-C1-070","PEDS-C1-071","PEDS-C1-072"]},{"id":"PEDS-U009","ch":1,"n":9,"title":"APGAR Scoring","sec":"Normal Observations in a Newborn · p4","guide":"APGAR = Activity, Pulse, Grimace, Appearance, Respiratory effort; each 0-2, total 0-10. Timing: 1 min after birth, followed by repeats. Normal 7-10/10, low <7/10. Grimace is elicited by irritating nasal mucosa with a nasogastric tube. Normal newborn heart rate: 120-160/min. (Book p4-5)","qs":["PEDS-C1-073","PEDS-C1-074","PEDS-C1-075","PEDS-C1-076","PEDS-C1-077","PEDS-C1-078","PEDS-C1-079","PEDS-C1-080","PEDS-C1-081","PEDS-C1-082","PEDS-C1-083","PEDS-C1-084","PEDS-C1-085","PEDS-C1-086","PEDS-C1-087","PEDS-C1-088","PEDS-C1-089","PEDS-C1-090","PEDS-C1-091","PEDS-C1-092"]},{"id":"PEDS-U010","ch":1,"n":10,"title":"Vital Signs of Newborn","sec":"Vital Signs · p5","guide":"Heart rate >100/min (term 100-160/min, preterm 120-180/min); respiratory rate 40-60/min; CRT <= 3 sec (checked by pressing ball of finger over sternum: blanching of skin, then skin becomes pink); temperature 36.5-37.5 C. (Book p5)","qs":["PEDS-C1-093","PEDS-C1-094","PEDS-C1-095","PEDS-C1-096","PEDS-C1-097","PEDS-C1-098","PEDS-C1-099"]},{"id":"PEDS-U011","ch":1,"n":11,"title":"Normal Skin Findings","sec":"Normal Findings · p5","guide":"Erythema toxicum: papulosaquamous lesions, eosinophils, onset >24 hr. Pustular melanosis: pustules + hyperpigmented patches, neutrophils, onset <24 hr. Epithelial inclusion cyst: keratin deposits (milia); palate = Epstein pearls, gum = Bohn's nodules. Mongolian spots: melanocytes in dermis, arrest in neural-crest migration. Salmon patch/stork bite/birthmark: forehead or nape of neck, vascular ectasia. (Book p5)","qs":["PEDS-C1-100","PEDS-C1-101","PEDS-C1-102","PEDS-C1-103","PEDS-C1-104","PEDS-C1-105","PEDS-C1-106","PEDS-C1-107","PEDS-C1-108","PEDS-C1-109","PEDS-C1-110","PEDS-C1-111","PEDS-C1-112"]},{"id":"PEDS-U012","ch":1,"n":12,"title":"Other Normal Findings","sec":"Normal Findings (contd) · p6","guide":"Breast engorgement and witch's milk (milk-like nipple discharge); bleeding per vagina in females (uterine shedding after sudden withdrawal of maternal hormones); small subconjunctival/retinal hemorrhage (stress of normal delivery); hymenal skin tags (female); physiological phimosis (male). None require treatment - only reassurance. (Book p6)","qs":["PEDS-C1-113","PEDS-C1-114","PEDS-C1-115","PEDS-C1-116","PEDS-C1-117","PEDS-C1-118","PEDS-C1-119"]},{"id":"PEDS-U013","ch":1,"n":13,"title":"Head Swellings: Caput Succedaneum","sec":"Head Swellings in Newborn · p6","guide":"Caput succedaneum: more common; diffuse swelling; superficial; scalp. D/t prolonged labour -> venous congestion -> fluid leakage. Content: fluid. Onset: at birth/soon after. Recovery: 2-3 days. No associations. (Book p6)","qs":["PEDS-C1-120","PEDS-C1-121","PEDS-C1-122","PEDS-C1-123","PEDS-C1-124","PEDS-C1-125","PEDS-C1-126","PEDS-C1-127","PEDS-C1-128"]},{"id":"PEDS-U014","ch":1,"n":14,"title":"Cephalohematoma & Subgaleal","sec":"Head Swellings in Newborn (contd) · p6","guide":"Cephalohematoma: localised, deep, sub-periosteal; d/t trauma to skull in instrumental delivery; blood; slowly increases after 12-24 hr; recovery 3-8 wks; associated with linear skull fractures and jaundice (heme breakdown). Subgaleal hemorrhage: below galea aponeurotica; vacuum extraction -> separation of scalp layers -> blood accumulation; fluctuant; appears soon after birth; most severe - shock, pallor, jaundice. (Book p6)","qs":["PEDS-C1-129","PEDS-C1-130","PEDS-C1-131","PEDS-C1-132","PEDS-C1-133","PEDS-C1-134","PEDS-C1-135","PEDS-C1-136","PEDS-C1-137","PEDS-C1-138","PEDS-C1-139","PEDS-C1-140","PEDS-C1-141","PEDS-C1-142","PEDS-C1-143"]},{"id":"PEDS-U015","ch":2,"n":15,"title":"Priority of Management","sec":"Priority of Management · p7","guide":"Priority of management in newborn: 1st Respiration (crying after birth), 2nd Temperature, 3rd Circulation. (Book p7)","qs":["PEDS-C2-001","PEDS-C2-002","PEDS-C2-003","PEDS-C2-004"]},{"id":"PEDS-U016","ch":2,"n":16,"title":"Management Algorithm","sec":"Management Algorithm · p7","guide":"Golden minute (1 min): initial action = temperature, airway, circulation (if no cry). Assess HR + respiratory effort. HR<100 -> PPV (30 sec). HR<60 -> chest compressions with ventilation (30 sec). No response -> adrenaline. Still no response -> consider volume expansion (NS 10 ml/kg; only if documented significant maternal ante-partum blood loss). Total duration 20 min; if no response -> declare death. (Book p7)","qs":["PEDS-C2-005","PEDS-C2-006","PEDS-C2-007","PEDS-C2-008","PEDS-C2-009","PEDS-C2-010","PEDS-C2-011","PEDS-C2-012","PEDS-C2-013","PEDS-C2-014","PEDS-C2-015","PEDS-C2-016","PEDS-C2-017","PEDS-C2-018","PEDS-C2-019"]},{"id":"PEDS-U017","ch":2,"n":17,"title":"Initial Assessment: 4 Pre-birth Questions","sec":"Initial Assessment · p7","guide":"4 pre-birth questions to predict and plan for outcome of delivery: 1. Term gestation? 2. Clear amniotic fluid? 3. Risk factors present (maternal or fetal)? 4. Umbilical cord management plan: delay cord clamping 30-60 sec (only if baby cried after birth); cord blood for newborn screening token. (Book p7)","qs":["PEDS-C2-020","PEDS-C2-021","PEDS-C2-022","PEDS-C2-023","PEDS-C2-024","PEDS-C2-025","PEDS-C2-026","PEDS-C2-027"]},{"id":"PEDS-U018","ch":2,"n":18,"title":"Initial Steps","sec":"Initial Steps · p8","guide":"1. Temperature: keep baby under warmer. 2. Breathing: gentle tactile stimulation (rubbing back with cotton towel, flicking soles). 3. Airway: slight neck extension (sniffing position) with towel under shoulder; suctioning only if visible secretions, order mouth -> nose (nose first -> blocked nose -> mouth breathing -> secretions aspirated). (Book p8)","qs":["PEDS-C2-028","PEDS-C2-029","PEDS-C2-030","PEDS-C2-031","PEDS-C2-032","PEDS-C2-033","PEDS-C2-034","PEDS-C2-035","PEDS-C2-036","PEDS-C2-037"]},{"id":"PEDS-U019","ch":2,"n":19,"title":"Assessment of HR & Respiratory Effort","sec":"HR & Respiratory Effort · p8","guide":"No cry (no breathing) -> significant hypoxia -> HR <100/min (normal newborn HR >100/min). HR>100 + poor/labored breathing -> O2 via hood (commonly used) or nasal prongs; if preterm (<32 wks) CPAP -> opens alveoli in collapsed premature lung. HR<100 or apnoea -> PPV: initially non-invasive BMV; upon failure invasive ET tube. (Book p8)","qs":["PEDS-C2-038","PEDS-C2-039","PEDS-C2-040","PEDS-C2-041","PEDS-C2-042","PEDS-C2-043","PEDS-C2-044","PEDS-C2-045","PEDS-C2-046","PEDS-C2-047","PEDS-C2-048"]},{"id":"PEDS-U020","ch":2,"n":20,"title":"BMV Parameters & Oxygen Targets","sec":"Bag and Mask Ventilation · p8","guide":"BMV: volume 40-750 ml, rate 40-60/min, response = HR>100/min. Pressure: 1st 30-40 cm H2O (open stiff airway), subsequent 15-30 cm H2O (prevent hyperinflation/alveolar rupture). FiO2: >=35 wks room air (21%); <35 wks start 21-30% and titrate to target SpO2 (right hand): 1 min 60-65, 2 min 65-70, 3 min 70-75, 4 min 75-80, 5 min 80-85, 10 min 85-95%. Excess O2 (preterm) -> hyperoxia damage: ROP -> blindness. (Book p8-9)","qs":["PEDS-C2-049","PEDS-C2-050","PEDS-C2-051","PEDS-C2-052","PEDS-C2-053","PEDS-C2-054","PEDS-C2-055","PEDS-C2-056","PEDS-C2-057","PEDS-C2-058","PEDS-C2-059","PEDS-C2-060","PEDS-C2-061","PEDS-C2-062","PEDS-C2-063","PEDS-C2-064","PEDS-C2-065"]},{"id":"PEDS-U021","ch":2,"n":21,"title":"MRSOPA & Ambu-bag","sec":"Ventilation Correction Steps · p9","guide":"Inadequate response -> correction in order, mnemonic MRSOPA: Mask repositioning (incorrect position = m/c cause), Readjust head position, Suction (remove all secretions), Open mouth, Pressure increase over bag, Alternate airway (ET tube) if all fail. Absolute C/I: congenital diaphragmatic hernia (air via esophagus -> inflates intrathoracic viscera -> lung compression). Ambu-bag: goal RR 40-60/min; mask should adequately cover nose and mouth (no leak). (Book p9)","qs":["PEDS-C2-066","PEDS-C2-067","PEDS-C2-068","PEDS-C2-069","PEDS-C2-070","PEDS-C2-071","PEDS-C2-072","PEDS-C2-073","PEDS-C2-074","PEDS-C2-075","PEDS-C2-076","PEDS-C2-077","PEDS-C2-078","PEDS-C2-079"]},{"id":"PEDS-U022","ch":2,"n":22,"title":"Endotracheal Intubation","sec":"Endotracheal Intubation · p10","guide":"Airway visualization via straight blade laryngoscope (size 0: preterm, size 1: term; on back of blade). ET type: uncuffed (prevent pressure tracheal necrosis). Inner diameter by weight: <1 kg 2.5 mm, 1-2 kg 3 mm, >2.5 kg 3.5 mm. Best confirmation: EtCO2 (capnography). Insertion depth: naso-tragal length (cm) + 1 cm. (Book p10)","qs":["PEDS-C2-080","PEDS-C2-081","PEDS-C2-082","PEDS-C2-083","PEDS-C2-084","PEDS-C2-085","PEDS-C2-086","PEDS-C2-087","PEDS-C2-088","PEDS-C2-089","PEDS-C2-090"]},{"id":"PEDS-U023","ch":2,"n":23,"title":"Chest Compression & Adrenaline","sec":"Chest Compression · p10","guide":"Chest compression done alongside ventilation (2 person), ratio 3:1 (90 compressions : 30 ventilations in 1 min), response monitored on cardiac monitor (HR>60); 2-thumb technique from head end, lower 1/3 sternum, depth 1/3 AP diameter. Adrenaline: preferred IV (umbilical vein), if inaccessible intraosseous; dose 0.1 ml/kg, strength 1:10,000. (Book p10)","qs":["PEDS-C2-091","PEDS-C2-092","PEDS-C2-093","PEDS-C2-094","PEDS-C2-095","PEDS-C2-096","PEDS-C2-097","PEDS-C2-098","PEDS-C2-099","PEDS-C2-100","PEDS-C2-101"]},{"id":"PEDS-U024","ch":3,"n":24,"title":"NEC: Introduction & Etiopathogenesis","sec":"Etiopathogenesis · p11","guide":"NEC: m/c and devastating surgical emergency in neonates. Causes: prematurity (<32 wks, GI immaturity), top feeds without breastmilk (formula, cow milk -> pathogenic bacterial colonisation), other factors (asphyxia, maternal cocaine use) -> vasoconstriction of splanchnic circulation -> necrosis; inflammatory necrosis d/t infection. (Book p11)","qs":["PEDS-C3-001","PEDS-C3-002","PEDS-C3-003","PEDS-C3-004","PEDS-C3-005","PEDS-C3-006","PEDS-C3-007","PEDS-C3-008"]},{"id":"PEDS-U025","ch":3,"n":25,"title":"NEC: Modified Bell's Staging","sec":"Modified Bell's Staging · p11","guide":"Stage I (Suspect NEC): bacterial colonisation + inflammation -> non-specific features (vomiting, abdominal distension); IA occult blood in stools, IB gross blood in stools; imaging normal. Stage II (Definite NEC): breaks in intestinal epithelium -> air in intestinal walls (pneumatosis intestinalis); IIa absent bowel sounds. Stage III (Complicated NEC): air + bacteria enter peritoneal cavity -> pneumoperitoneum + peritonitis; IIIa induration/redness/tenderness of abdominal wall; IIIb intestinal perforation. Air in wall -> venous drainage -> SMV -> portal vein: pneumatosis portalis. (Book p11-12)","qs":["PEDS-C3-009","PEDS-C3-010","PEDS-C3-011","PEDS-C3-012","PEDS-C3-013","PEDS-C3-014","PEDS-C3-015","PEDS-C3-016","PEDS-C3-017","PEDS-C3-018","PEDS-C3-019","PEDS-C3-020","PEDS-C3-021","PEDS-C3-022","PEDS-C3-023","PEDS-C3-024","PEDS-C3-025","PEDS-C3-026"]},{"id":"PEDS-U026","ch":3,"n":26,"title":"NEC: Management","sec":"Management (NEC) · p12","guide":"Triad of lab findings (thrombocytopenia, metabolic acidosis, hyponatremia): seen only after stage IIb; do not have great relevance in diagnosis. Until stage IIIa: medical management - NPO, TPN, IV antibiotics (penicillin gram+ve, aminoglycoside gram-ve, metronidazole anaerobes). Antibiotic duration: stage Ia 3 days, Ib 7-10 days, II and IIIa 14 days. Stage IIIb: unstable -> 1st peritoneal drainage (emergency), after stabilization -> laparotomy -> resection + anastomosis; stable -> laparotomy directly. Untreated: m/c cause of neonatal mortality. (Book p12)","qs":["PEDS-C3-027","PEDS-C3-028","PEDS-C3-029","PEDS-C3-030","PEDS-C3-031","PEDS-C3-032","PEDS-C3-033","PEDS-C3-034","PEDS-C3-035","PEDS-C3-036","PEDS-C3-037","PEDS-C3-038","PEDS-C3-039","PEDS-C3-040","PEDS-C3-041","PEDS-C3-042"]},{"id":"PEDS-U027","ch":3,"n":27,"title":"Sepsis: Spectrum & Classification","sec":"Spectrum of Neonatal Sepsis · p13","guide":"Types: generalised (septicemia); localised (specific organ systems: respiratory - pneumonia, CNS - meningitis, bones & joints - osteomyelitis, arthritis). Early onset: first 72 hrs of life, source maternal, risk factors chorioamnionitis/foul smelling liquor/ROM >72 hrs, type: pneumonia >> sepsis. Late onset: >72 hrs, hospital acquired infection, risk factors unclean hands of health professionals & caregivers, LBW (down immunity), lack of breastfeeding; equal incidence of sepsis, pneumonia and meningitis. (Book p13)","qs":["PEDS-C3-043","PEDS-C3-044","PEDS-C3-045","PEDS-C3-046","PEDS-C3-047","PEDS-C3-048","PEDS-C3-049","PEDS-C3-050","PEDS-C3-051","PEDS-C3-052","PEDS-C3-053","PEDS-C3-054","PEDS-C3-055","PEDS-C3-056","PEDS-C3-057","PEDS-C3-058","PEDS-C3-059"]},{"id":"PEDS-U028","ch":3,"n":28,"title":"Sepsis: Etiology & Clinical Features","sec":"Etiology & Clinical Features · p13","guide":"India: 1. Klebsiella (m/c), 2. Acinetobacter, 3. S. aureus. Worldwide: 1. Group B Streptococcus (GBS), 2. E. coli, 3. Listeria. Weak immune response -> non-specific symptoms -> suspect sepsis in any sick baby. Early symptoms: change in feeding pattern, lethargy, hypothermia >> fever. Pneumonia: respiratory distress. Meningitis: fever and irritability (non specific), seizures. (Book p13)","qs":["PEDS-C3-060","PEDS-C3-061","PEDS-C3-062","PEDS-C3-063","PEDS-C3-064","PEDS-C3-065","PEDS-C3-066","PEDS-C3-067","PEDS-C3-068","PEDS-C3-069","PEDS-C3-070","PEDS-C3-071"]},{"id":"PEDS-U029","ch":3,"n":29,"title":"Sepsis: Investigations","sec":"Investigations · p14","guide":"Blood culture: gold standard; disadvantage time-consuming. Sepsis screen: presence of >2 findings: TLC down (<5000/mm3), ANC down (<1800/mm3), I/T neutrophil ratio up (>0.2), micro-ESR up (>15 mm/hr), CRP up (>1 mg/dl). Newest marker: up procalcitonin. LP: indication = suspicion of meningitis in all symptomatic babies; C/I = asymptomatic babies (even with risk factors). (Book p14)","qs":["PEDS-C3-072","PEDS-C3-073","PEDS-C3-074","PEDS-C3-075","PEDS-C3-076","PEDS-C3-077","PEDS-C3-078","PEDS-C3-079","PEDS-C3-080","PEDS-C3-081","PEDS-C3-082"]},{"id":"PEDS-U030","ch":3,"n":30,"title":"Sepsis: Treatment","sec":"Treatment · p14","guide":"Empirical antibiotics (while awaiting culture): low resistance: penicillin (gram+ve cover) + aminoglycoside (amikacin/gentamicin); suspected meningitis: ampicillin + 3rd gen cephalosporin (cefotaxime); high resistance: ciprofloxacin (+amikacin) or piperacillin-tazobactam + amikacin (m/c). Duration: culture negative 5-7 days (1 week); culture positive: meningitis 3 weeks, others 2 weeks. (Book p14)","qs":["PEDS-C3-083","PEDS-C3-084","PEDS-C3-085","PEDS-C3-086","PEDS-C3-087","PEDS-C3-088","PEDS-C3-089","PEDS-C3-090"]},{"id":"PEDS-U031","ch":3,"n":31,"title":"Sepsis Algorithm","sec":"Sepsis Algorithm · p15","guide":"Suspected sepsis: early onset (<72 hrs) with risk factors -> start antibiotics + blood culture; then symptoms (LP indications): present -> perform LP, absent -> no LP; no risk factors -> close monitoring. Late onset (>72 hrs): no symptoms -> close monitoring; symptoms: sick baby -> antibiotics, blood culture, LP; not sick -> sepsis screen (+ -> same triad). (Book p15)","qs":["PEDS-C3-091","PEDS-C3-092","PEDS-C3-093","PEDS-C3-094","PEDS-C3-095","PEDS-C3-096","PEDS-C3-097","PEDS-C3-098"]},{"id":"PEDS-U032","ch":4,"n":32,"title":"Clinical Features of Respiratory Distress","sec":"Clinical Features · p16","guide":"Clinical features: 1. Respiratory rate increased (>60 breaths/min; normal newborn RR 40-60/min). 2. Chest retraction: d/t involvement of accessory respiratory muscles. 3. Severe hypoxia (severe cases): central cyanosis (involves mucosa as well), grunting (expiration against partially closed glottis -> prevents airway/alveolar collapse). (Book p16)","qs":["PEDS-C4-001","PEDS-C4-002","PEDS-C4-003","PEDS-C4-004","PEDS-C4-005","PEDS-C4-006","PEDS-C4-007"]},{"id":"PEDS-U033","ch":4,"n":33,"title":"Silverman Anderson Score","sec":"Silverman Anderson Score · p16","guide":"Used for preterm babies. 5 criteria scored 0/1/2: upper chest retraction (0 synchronized chest-abdomen, 1 lag, 2 see-saw), lower chest retraction, nasal flaring, xiphoid retractions (not seen/mild/severe), grunting (not present/audible with stethoscope/audible without). Interpretation: <5 mild, 5-7 moderate, >7 severe. (Book p16)","qs":["PEDS-C4-008","PEDS-C4-009","PEDS-C4-010","PEDS-C4-011","PEDS-C4-012","PEDS-C4-013","PEDS-C4-014","PEDS-C4-015","PEDS-C4-016","PEDS-C4-017"]},{"id":"PEDS-U034","ch":4,"n":34,"title":"Downe's Score","sec":"Downe's Score · p16","guide":"Used for term and preterm babies. Mnemonic for criteria: CRAG (Cyanosis, Respiratory rate, Air entry, Grunting). Scored 0/1/2. Interpretation: <3 mild, 4-6 moderate, >6 severe (impending respiratory failure). (Book p16)","qs":["PEDS-C4-018","PEDS-C4-019","PEDS-C4-020","PEDS-C4-021","PEDS-C4-022","PEDS-C4-023","PEDS-C4-024","PEDS-C4-025","PEDS-C4-026","PEDS-C4-027","PEDS-C4-028","PEDS-C4-029","PEDS-C4-030"]},{"id":"PEDS-U035","ch":4,"n":35,"title":"Causes of Respiratory Distress","sec":"Causes of Respiratory Distress · p17","guide":"Onset within 6 hours of birth: TTNB (m/c overall), RDS, meconium aspiration syndrome. Onset any time after birth: pneumonia, pneumothorax. Also: anomalies of lung development. (Book p17)","qs":["PEDS-C4-031","PEDS-C4-032","PEDS-C4-033","PEDS-C4-034"]},{"id":"PEDS-U036","ch":4,"n":36,"title":"TTNB: Transient Tachypnea of Newborn","sec":"TTNB · p17","guide":"AKA wet lung syndrome. m/c in term neonates and neonates delivered by LSCS. Pathogenesis: term neonate -> adequate stimulation and compression at birth (birth canal) -> clearance of lung fluids; without it -> delayed clearance of lung fluids. CXR: perihilar radio-opaque streaks (fluid in hilium -> bronchovascular structures -> white streaks, AKA sunburst appearance); fluid in interlobar fissure. Management: supportive (O2 inhalation) sufficient (transient); improvement in 48-72 hours. (Book p17)","qs":["PEDS-C4-035","PEDS-C4-036","PEDS-C4-037","PEDS-C4-038","PEDS-C4-039","PEDS-C4-040","PEDS-C4-041","PEDS-C4-042","PEDS-C4-043","PEDS-C4-044","PEDS-C4-045"]},{"id":"PEDS-U037","ch":4,"n":37,"title":"RDS: Hyaline Membrane Disease","sec":"RDS · p17","guide":"AKA hyaline membrane disease (HMD). m/c in preterm (<34 wks) born to mothers who haven't received antenatal steroids (m/c: dexamethasone) and infants of diabetic mothers (up insulin -> down surfactant). Down surfactant -> up surface tension -> alveolar collapse and respiratory distress. Surfactant keeps alveoli open by decreasing surface tension. Histology: eosinophilic substances in lung tissue (resembles hyaline). CXR: white out/ground glass (collapsed alveoli, no air entry); air bronchogram sign (open airway tract). (Book p17-18)","qs":["PEDS-C4-046","PEDS-C4-047","PEDS-C4-048","PEDS-C4-049","PEDS-C4-050","PEDS-C4-051","PEDS-C4-052","PEDS-C4-053","PEDS-C4-054","PEDS-C4-055","PEDS-C4-056"]},{"id":"PEDS-U038","ch":4,"n":38,"title":"RDS: Management & Surfactant","sec":"Management (RDS) · p18","guide":"Severity by Silverman score: mild (<5) and moderate (5-7) -> CPAP (PEEP of 5-7 mm H2O maintained -> keeps alveoli open); severe (>7) -> mechanical ventilation; surfactant replacement therapy. SRT types: natural (beractant bovine, poractant pigs), recombinant synthetic (with SP-B). Administration: endotracheal; technique: ET tube (mnemonic INSURE: intubation, surfactant, extubation) or surfactant tracheal catheter (STC) - less invasive. Earlier synthetic surfactants leaked SP-B -> down efficacy. (Book p18)","qs":["PEDS-C4-057","PEDS-C4-058","PEDS-C4-059","PEDS-C4-060","PEDS-C4-061","PEDS-C4-062","PEDS-C4-063","PEDS-C4-064","PEDS-C4-065","PEDS-C4-066","PEDS-C4-067","PEDS-C4-068"]},{"id":"PEDS-U039","ch":4,"n":39,"title":"Meconium Aspiration Syndrome (MAS)","sec":"MAS · p19","guide":"Pathogenesis: post-term baby (>42 wks) / IUGR baby stress -> meconium expulsion before birth -> aspiration of meconium stained liquor (MSL). Consequences: 1. Atelectasis (d/t complete airway obstruction); 2. Air trapping (partial obstruction) -> hyperinflation/obstructive emphysema; 3. Chemical pneumonitis -> inactivation of surfactant -> impaired gas exchange -> hypoxia, hypercapnia -> chronic pulmonary vasoconstriction -> PPHN. CXR: infiltrates in lung field. Diagnosis: by exclusion + with h/o MSL. Management: supportive (O2, CPAP, MV in severe); inhaled nitric oxide (iNO): pulmonary vasodilator for PPHN. (Book p19)","qs":["PEDS-C4-069","PEDS-C4-070","PEDS-C4-071","PEDS-C4-072","PEDS-C4-073","PEDS-C4-074","PEDS-C4-075","PEDS-C4-076","PEDS-C4-077","PEDS-C4-078","PEDS-C4-079","PEDS-C4-080","PEDS-C4-081"]},{"id":"PEDS-U040","ch":4,"n":40,"title":"Congenital Diaphragmatic Hernia (CDH)","sec":"CDH · p19","guide":"Pathogenesis: anatomical defect in diaphragm. Types: Bochdalek (m/c, postero-lateral), Morgagni (antero-medial). Features: respiratory distress (compression of lung in utero d/t movement of intestines into mediastinum -> pulmonary hypoplasia), mediastinal shift -> heart sound heard on right side, sunken/scaphoid abdomen. Investigations: USG antenatal; CXR postnatal (intestinal air shadows, absent diaphragm shadow on affected side). Management: no cry at birth -> resuscitation; cries: medical (first 48 hrs: NG tube -> down lung compression, MV via ET tube -> up lung expansion) then surgical (>48 hrs: hernia repair). CDH is absolute C/I for bag and mask ventilation (air into esophagus -> bowel loop inflation -> lung compression). Prognosis: antenatal USG LHR <1 and liver in thorax bad; postnatal PPHN (most important) and onset of distress <24 hrs bad. (Book p19-20)","qs":["PEDS-C4-082","PEDS-C4-083","PEDS-C4-084","PEDS-C4-085","PEDS-C4-086","PEDS-C4-087","PEDS-C4-088","PEDS-C4-089","PEDS-C4-090","PEDS-C4-091","PEDS-C4-092","PEDS-C4-093","PEDS-C4-094","PEDS-C4-095","PEDS-C4-096","PEDS-C4-097","PEDS-C4-098","PEDS-C4-099","PEDS-C4-100","PEDS-C4-101"]},{"id":"PEDS-U041","ch":5,"n":41,"title":"Incidence & Bilirubin Metabolism","sec":"Neonatal Jaundice (Intro) · p21","guide":"Incidence: seen in upto 60% newborns -> pathological 5-10% (require treatment), physiological majority (no treatment required). Bilirubin metabolism: breakdown of RBCs -> haem -> biliverdin -> unconjugated bilirubin (water insoluble) --UDPGT (uridine diphosphate glucuronyl transferase, in liver)--> conjugated bilirubin (water soluble) -> through bile duct -> intestines: stercobilinogen (in colon) 90% excreted in stools, urobilinogen 10% excreted in urine; enterohepatic circulation loops back. (Book p21)","qs":["PEDS-C5-001","PEDS-C5-002","PEDS-C5-003","PEDS-C5-004","PEDS-C5-005","PEDS-C5-006","PEDS-C5-007","PEDS-C5-008","PEDS-C5-009","PEDS-C5-010","PEDS-C5-011","PEDS-C5-012","PEDS-C5-013"]},{"id":"PEDS-U042","ch":5,"n":42,"title":"Assessment of Jaundice (Kramer & TcB)","sec":"Assessment of Jaundice · p21-22","guide":"1. Serum bilirubin levels: best investigation; value = total serum bilirubin (TSB) -> Direct = conjugated, Indirect = unconjugated. 2. Screening of baby: initial clinical assessment; Kramer method (visual, cephalo-caudal progression): face & neck 5-7 mg/dL (seen first in eyes), chest & upper abdomen 7-9, lower abdomen & thighs 9-11, legs/arms/forearms 11-13, palms & soles = danger sign >13-15 mg/dL (risk of kernicterus). Transcutaneous bilirubinometry (TcB): tip on skin (m/c sternum), visualizes appropriate TSB; better than visual assessment; unreliable in high bilirubin (>15 mg/dL) and preterm babies. (Book p21-22)","qs":["PEDS-C5-014","PEDS-C5-015","PEDS-C5-016","PEDS-C5-017","PEDS-C5-018","PEDS-C5-019","PEDS-C5-020","PEDS-C5-021","PEDS-C5-022","PEDS-C5-023","PEDS-C5-024","PEDS-C5-025","PEDS-C5-026","PEDS-C5-027","PEDS-C5-028","PEDS-C5-029","PEDS-C5-030","PEDS-C5-031"]},{"id":"PEDS-U043","ch":5,"n":43,"title":"Types of Jaundice (Physiological vs Pathological)","sec":"Types Of Jaundice · p22","guide":"Table: incidence common vs less common; TSB mildly elevated vs largely elevated >15 mg/dL; rate of increase >5 mg/dL (pathological); onset usually 24-72 hrs vs <24 hrs; duration 1-2 weeks vs beyond 3-4 weeks; peak 3rd-5th day; palms & soles not affected vs affected; treatment not required (wait & watch) vs required. Any 1 positive = pathological. Note: clay/pale stools = obstruction (bile duct or intestine); conjugated bilirubin pathological if >1 mg/dL or >20% of TSB -> absorbed into blood -> urobilinogen -> dark yellow urine; cannot pass into colon -> absence of stercobilinogen -> pale/yellow stools. (Book p22)","qs":["PEDS-C5-032","PEDS-C5-033","PEDS-C5-034","PEDS-C5-035","PEDS-C5-036","PEDS-C5-037","PEDS-C5-038","PEDS-C5-039","PEDS-C5-040","PEDS-C5-041","PEDS-C5-042","PEDS-C5-043","PEDS-C5-044","PEDS-C5-045","PEDS-C5-046","PEDS-C5-047","PEDS-C5-048"]},{"id":"PEDS-U044","ch":5,"n":44,"title":"Causes of Jaundice","sec":"Causes Of Jaundice · p22","guide":"Pathological jaundice: up unconjugated bilirubin (hemolytic disorders = up breakdown of RBC e.g. hereditary spherocytosis, G6-PD deficiency; blood group incompatibility = maternal antibodies e.g. ABO/Rh; down UDPGT enzyme activity = sepsis, hypothyroidism; inherited defect of UDPGT = Crigler Najjar syndrome [Type I complete absence-severe, Type II partial absence]; extravasation of blood = cephalhemotoma) and up conjugated bilirubin (biliary atresia = obstruction of bile flow to intestine). (Book p22)","qs":["PEDS-C5-049","PEDS-C5-050","PEDS-C5-051","PEDS-C5-052","PEDS-C5-053","PEDS-C5-054","PEDS-C5-055","PEDS-C5-056","PEDS-C5-057","PEDS-C5-058","PEDS-C5-059"]},{"id":"PEDS-U045","ch":5,"n":45,"title":"Breastfeeding & Breastmilk Jaundice","sec":"Breastfeeding Jaundice · p23","guide":"Breast feeding jaundice: AKA suboptimal intake hyperbilirubinemia; down breast milk intake -> up enterohepatic circulation -> bilirubin re-enters liver -> up bilirubin levels; onset 5-7 days (upto 1 week); feature: excessive weight loss (>10% body weight); management: increase breastfeeding frequency and duration. Breastmilk jaundice: jaundice >3 weeks, diagnosis of exclusion; beta-glucuronidase in milk -> down conjugation -> up unconjugated bilirubin; management: continue breastfeeding, transient & self resolving. (Book p23)","qs":["PEDS-C5-060","PEDS-C5-061","PEDS-C5-062","PEDS-C5-063","PEDS-C5-064","PEDS-C5-065","PEDS-C5-066","PEDS-C5-067","PEDS-C5-068","PEDS-C5-069","PEDS-C5-070","PEDS-C5-071"]},{"id":"PEDS-U046","ch":5,"n":46,"title":"Treatment: Normogram & Phototherapy","sec":"Treatment of Pathological Jaundice · p23-24","guide":"Normogram: used to decide course of treatment (serum bilirubin vs age in hours; plotted curve abnormal vs highest/normal curve). Phototherapy: blue-green LED (400-490 nm), protection of eye & gonads (testis); mechanism: a. structural isomerism (bilirubin -> lumirubin -> excreted), b. photoisomerisation (light -> bilirubin isomers), c. photooxidation; minimum irradiance 30 microwatt/cm2/nm; minimum distance 30-45 cm; terminate when at least 2 consequent values within normal curves on normogram; C/I: conjugated bilirubin (brown pigment formation -> Bronze baby syndrome). (Book p23-24)","qs":["PEDS-C5-072","PEDS-C5-073","PEDS-C5-074","PEDS-C5-075","PEDS-C5-076","PEDS-C5-077","PEDS-C5-078","PEDS-C5-079","PEDS-C5-080","PEDS-C5-081","PEDS-C5-082","PEDS-C5-083"]},{"id":"PEDS-U047","ch":5,"n":47,"title":"Double Volume Exchange Transfusion (DVET)","sec":"DVET · p24","guide":"DVET indications: very high bilirubin level (abnormal in normogram); Rh isoimmunization with cord blood bilirubin >5 mg/dL or cord blood hemoglobin <10 mg/dL. Mechanism: simultaneous removal of blood with up bilirubin and replacement with equal volume of fresh blood. Amount: normal blood volume in body 80-90 mL/kg; volume exchanged 160-180 mL/kg. (Book p24)","qs":["PEDS-C5-084","PEDS-C5-085","PEDS-C5-086","PEDS-C5-087","PEDS-C5-088","PEDS-C5-089","PEDS-C5-090"]},{"id":"PEDS-U048","ch":5,"n":48,"title":"Management Protocol (Algorithm)","sec":"Management Protocol · p24","guide":"Newborn jaundice screening every 12 hours for 3-5 days post-birth. Serious jaundice present? d. onset <24 hours; e. yellow palms/soles; f. signs of bilirubin encephalopathy (hypertonia: opisthotonus; high pitched cry). Yes -> start phototherapy immediately + serum bilirubin testing -> plot on normogram, decide further management. No -> assess if jaundice is pathological: Yes -> serum bilirubin testing; No -> observation + followup. (Book p24)","qs":["PEDS-C5-091","PEDS-C5-092","PEDS-C5-093","PEDS-C5-094","PEDS-C5-095","PEDS-C5-096","PEDS-C5-097","PEDS-C5-098","PEDS-C5-099","PEDS-C5-100","PEDS-C5-101","PEDS-C5-102"]},{"id":"PEDS-U049","ch":6,"n":49,"title":"Temperature Regulation","sec":"Temperature Regulation · p25","guide":"Normal temperature 36.5–37.5°C (roof of dry axilla, electronic thermometer). Heat loss: radiation (major), convection (air flow), evaporation (via sweat), conduction; head = major site (large surface area). Heat production: ↑ physical activity & brown fat non-shivering thermogenesis (nape of neck m/c, interscapular, perirenal) via uncoupling of oxidative phosphorylation → hypothalamus stress → ↑ noradrenaline → ↑ β-oxidation → heat, brown fat ↑ mitochondria. (Book p25)","qs":["PEDS-C6-001","PEDS-C6-002","PEDS-C6-003","PEDS-C6-004","PEDS-C6-005","PEDS-C6-006","PEDS-C6-007","PEDS-C6-008","PEDS-C6-009","PEDS-C6-010","PEDS-C6-011","PEDS-C6-012","PEDS-C6-013","PEDS-C6-014","PEDS-C6-015","PEDS-C6-016","PEDS-C6-017","PEDS-C6-018","PEDS-C6-019","PEDS-C6-020"]},{"id":"PEDS-U050","ch":6,"n":50,"title":"Hypothermia: Classification","sec":"Hypothermia · p25","guide":"Cold stress 36.4–36°C (cold extremities, warm body), moderate hypothermia 36–32°C, severe <32°C; hyperthermia >37.5°C. Prevention of hypothermia is a critical aspect of newborn care. (Book p25)","qs":["PEDS-C6-021","PEDS-C6-022","PEDS-C6-023","PEDS-C6-024","PEDS-C6-025","PEDS-C6-026"]},{"id":"PEDS-U051","ch":6,"n":51,"title":"Prevention of Hypothermia — Stable Baby (KMC)","sec":"Prevention of Hypothermia · p25","guide":"In hemodynamically stable baby: 1. Cover head to toe; 2. Kangaroo mother care (KMC) for LBW/preterm, nutrition breastfeed, duration as long as possible, mother can nap in semi-recumbent 30° elevation, avoid <1 hr sessions (repeated handling → stress), stop once ≥2.5 kg or at 37 wks. KMC: turn head to one side, baby close to mother, skin-to-skin by conduction; position upright, frog-leg flexed. (Book p25)","qs":["PEDS-C6-027","PEDS-C6-028","PEDS-C6-029","PEDS-C6-030","PEDS-C6-031","PEDS-C6-032","PEDS-C6-033","PEDS-C6-034","PEDS-C6-035","PEDS-C6-036","PEDS-C6-037","PEDS-C6-038","PEDS-C6-039","PEDS-C6-040"]},{"id":"PEDS-U052","ch":6,"n":52,"title":"Prevention of Hypothermia — Unstable Baby (NICU)","sec":"Prevention of Hypothermia · p26","guide":"In hemodynamically unstable baby placed in NICU: 1. Overhead radiant warmer = open source, heat by radiation, modes manual vs auto/servo (preferred); 2. Incubator = closed/covered source of heat. (Book p26)","qs":["PEDS-C6-041","PEDS-C6-042","PEDS-C6-043","PEDS-C6-044","PEDS-C6-045","PEDS-C6-046","PEDS-C6-047"]},{"id":"PEDS-U053","ch":6,"n":53,"title":"Neonatal Hypoglycemia: Definition, Screening & Risk Factors","sec":"Neonatal Hypoglycemia · p27","guide":"Hypoglycemia = blood glucose <45 mg/dL. Can be asymptomatic yet dangerous → screen (heel prick, routine newborn care). Risk factors: inadequate substrate (SGA <3rd percentile, preterm <35 wks), relative hyperinsulinemia (LGA, IDM), sick neonates (sepsis, birth asphyxia, severe hypothermia). High-risk period first 72 hrs. (Book p27)","qs":["PEDS-C6-048","PEDS-C6-049","PEDS-C6-050","PEDS-C6-051","PEDS-C6-052","PEDS-C6-053","PEDS-C6-054","PEDS-C6-055","PEDS-C6-056","PEDS-C6-057","PEDS-C6-058","PEDS-C6-059"]},{"id":"PEDS-U054","ch":6,"n":54,"title":"Hypoglycemia: Manifestations & Management","sec":"Neonatal Hypoglycemia · p27","guide":"1. Asymptomatic; 2. Symptomatic: jitteriness/tremors m/c & earliest (stops with stimulus), seizure not stimulus-sensitive, lethargy, refusal of feeds, autonomic symptoms uncommon. Management: symptomatic IV 2 mL/kg 10% dextrose → continuous infusion GIR 6 mg/kg/min ↑ by 2 mg/kg/min → 12 mg/kg/min; asymptomatic <40 mg/dL start infusion, 40–45 mg/dL trial of oral breastfeeds → reassess after 20–30 min. (Book p27)","qs":["PEDS-C6-060","PEDS-C6-061","PEDS-C6-062","PEDS-C6-063","PEDS-C6-064","PEDS-C6-065","PEDS-C6-066","PEDS-C6-067","PEDS-C6-068","PEDS-C6-069","PEDS-C6-070","PEDS-C6-071","PEDS-C6-072","PEDS-C6-073","PEDS-C6-074"]},{"id":"PEDS-U055","ch":6,"n":55,"title":"Resistant Hypoglycemia","sec":"Resistant Hypoglycemia · p28","guide":"Resistant = GIR >12 mg/kg/min or persists >7 days. Causes: hypopituitarism (↓ ACTH), metabolic (glycogen storage, galactosemia), nesidioblastosis (β-islet hyperplasia → congenital hypoglycemia). Treatment: stimulate gluconeogenesis (hydrocortisone, glucagon) & ↓ insulin (diazoxide, octreotide); avoid diazoxide/glucagon in SGA babies. (Book p28)","qs":["PEDS-C6-075","PEDS-C6-076","PEDS-C6-077","PEDS-C6-078","PEDS-C6-079","PEDS-C6-080","PEDS-C6-081","PEDS-C6-082","PEDS-C6-083"]},{"id":"PEDS-U056","ch":6,"n":56,"title":"Infant of Diabetic Mother (IDM)","sec":"Infant of Diabetic Mother · p28","guide":"Pedersen's hypothesis: maternal hyperglycemia ↑ glucose → placenta → fetus ↑ insulin → anabolism & growth → LGA. Effects of ↑ insulin: asymmetric septal hypertrophy (resolves when insulin ↓), inactivation of surfactant → alveoli collapse → RDS, lazy left colon (↓ gut motility → delayed meconium). LGA side effect: ↑ O2 → ↑ RBC/polycythemia → hyperviscosity → thromboembolism. Congenital anomalies if hyperglycemia in 1st trimester (embryogenesis): cardiac m/c VSD, most specific TGA; CNS m/c NTD, most specific caudal regression (lumbosacral agenesis). Metabolic: ↑ insulin → ↓ PTH → functional hypoparathyroidism → hypocalcemia <8 mg/dL & hypomagnesemia <1.5 mg/dL; hypoglycemia m/c cause of seizure (> hypocalcemia). (Book p28-29)","qs":["PEDS-C6-084","PEDS-C6-085","PEDS-C6-086","PEDS-C6-087","PEDS-C6-088","PEDS-C6-089","PEDS-C6-090","PEDS-C6-091","PEDS-C6-092","PEDS-C6-093","PEDS-C6-094","PEDS-C6-095","PEDS-C6-096","PEDS-C6-097","PEDS-C6-098","PEDS-C6-099","PEDS-C6-100","PEDS-C6-101","PEDS-C6-102","PEDS-C6-103","PEDS-C6-104","PEDS-C6-105"]},{"id":"PEDS-U057","ch":7,"n":1,"title":"Neonatal Reflexes — Primitive Reflexes Table","sec":"Neonatal reflexes · p30","qs":["PEDS-C7-001","PEDS-C7-002","PEDS-C7-003","PEDS-C7-004","PEDS-C7-005","PEDS-C7-006","PEDS-C7-007","PEDS-C7-008","PEDS-C7-009","PEDS-C7-010","PEDS-C7-011","PEDS-C7-012","PEDS-C7-013","PEDS-C7-014","PEDS-C7-015","PEDS-C7-016","PEDS-C7-017","PEDS-C7-018"],"guide":"Primitive (immature) reflexes disappear after birth. Palmar grasp 28w→32w→2-3m, Rooting 28-32w→34-36w→<1m prominent (finds nipple), Moro 28-32w→37w→5-6m, ATNR 35w→1m postnatal→6-7m."},{"id":"PEDS-U058","ch":7,"n":2,"title":"Moro Reflex — Abnormalities","sec":"Moro reflex – Abnormalities · p30","qs":["PEDS-C7-019","PEDS-C7-020","PEDS-C7-021","PEDS-C7-022","PEDS-C7-023","PEDS-C7-024","PEDS-C7-025","PEDS-C7-026","PEDS-C7-027","PEDS-C7-028","PEDS-C7-029","PEDS-C7-030"],"guide":"Absent in term = brain structural/functional (anencephaly, HIE). Sluggish = hypotonia (metabolic, Down, SMA). Unilateral = limb pathology: nerve (Erb’s/Klumpke) vs bone (clavicle fracture m/c)."},{"id":"PEDS-U059","ch":7,"n":3,"title":"Postnatal Reflexes — SPL","sec":"Postnatal reflexes · p31","qs":["PEDS-C7-031","PEDS-C7-032","PEDS-C7-033","PEDS-C7-034","PEDS-C7-035","PEDS-C7-036","PEDS-C7-037","PEDS-C7-038","PEDS-C7-039","PEDS-C7-040","PEDS-C7-041","PEDS-C7-042","PEDS-C7-043","PEDS-C7-044","PEDS-C7-045","PEDS-C7-046","PEDS-C7-047","PEDS-C7-048"],"guide":"Appear after birth; mnemonic SPL (Special). STNR 4-6m→8-12m, Parachute 7-8m→never disappears (forward protective extension), Landau 3m→≤9m; ventral suspension, prone and tilt tests."},{"id":"PEDS-U060","ch":7,"n":4,"title":"Birth Asphyxia and HIE — Definitions","sec":"Birth asphyxia and HIE · p31","qs":["PEDS-C7-049","PEDS-C7-050","PEDS-C7-051","PEDS-C7-052","PEDS-C7-053","PEDS-C7-054","PEDS-C7-055","PEDS-C7-056","PEDS-C7-057","PEDS-C7-058","PEDS-C7-059","PEDS-C7-060","PEDS-C7-061","PEDS-C7-062","PEDS-C7-063","PEDS-C7-064"],"guide":"WHO: failure to initiate/sustain breathing. NNF: APGAR 1-min moderate 4-6/10, severe 0-3/10. AAP essential: cord pH<7, APGAR 0-3 at 5-min, neurologic HIE signs, multi-organ (oliguria, ↑LFT). AKA perinatal asphyxia/depression."},{"id":"PEDS-U061","ch":7,"n":5,"title":"Hypoxic Ischemic Encephalopathy — Sarnat Staging","sec":"Hypoxic ischemic encephalopathy · p31","qs":["PEDS-C7-065","PEDS-C7-066","PEDS-C7-067","PEDS-C7-068","PEDS-C7-069","PEDS-C7-070","PEDS-C7-071","PEDS-C7-072","PEDS-C7-073","PEDS-C7-074","PEDS-C7-075","PEDS-C7-076","PEDS-C7-077","PEDS-C7-078","PEDS-C7-079","PEDS-C7-080","PEDS-C7-081","PEDS-C7-082"],"guide":"HIE = leading neonatal brain injury worldwide; Birth asphyxia→Hypoxia→Ischemia. Sarnat & Sarnat staging: Stage1 99% normal (irritable, mydriasis, normal EEG), Stage2 80% recovery (lethargic, miosis, seizures), Stage3 50% death (comatose, burst-suppression)."},{"id":"PEDS-U062","ch":7,"n":6,"title":"HIE — Complications and Investigations","sec":"Complications · p32","qs":["PEDS-C7-083","PEDS-C7-084","PEDS-C7-085","PEDS-C7-086","PEDS-C7-087","PEDS-C7-088","PEDS-C7-089","PEDS-C7-090","PEDS-C7-091","PEDS-C7-092"],"guide":"Term: parasagittal→spastic quadriplegia, focal necrosis→hemiplegic CP, basal ganglia→dystonic/extrapyramidal (chorea/athetosis). Preterm: PVL→spastic diplegia (lower limbs). IOC: DWI MRI. + intellectual disability."},{"id":"PEDS-U063","ch":7,"n":7,"title":"HIE — Management and Therapeutic Hypothermia","sec":"Management · p32","qs":["PEDS-C7-093","PEDS-C7-094","PEDS-C7-095","PEDS-C7-096","PEDS-C7-097","PEDS-C7-098","PEDS-C7-099","PEDS-C7-100","PEDS-C7-101","PEDS-C7-102","PEDS-C7-103","PEDS-C7-104","PEDS-C7-105"],"guide":"Supportive: temp, vitals, glucose 75-100 mg/dL neuroprotective, phenobarbitone for seizures. Therapeutic hypothermia: 33.5-34.5°C, start ≤6h stop ≤72h, Stage2/3 >36wks; preterm <36w C/I; whole-body better than selective head; ↓metabolism→↓free radicals."},{"id":"PEDS-U064","ch":7,"n":8,"title":"Neonatal Seizures — Types and Etiology","sec":"Neonatal seizures · p34","qs":["PEDS-C7-106","PEDS-C7-107","PEDS-C7-108","PEDS-C7-109","PEDS-C7-110","PEDS-C7-111","PEDS-C7-112","PEDS-C7-113","PEDS-C7-114","PEDS-C7-115","PEDS-C7-116","PEDS-C7-117","PEDS-C7-118","PEDS-C7-119","PEDS-C7-120"],"guide":"Types: Subtle m/c (minimal: blinking/finger rolling/lip chewing), focal clonic best prognosis, myoclonic worst. Etiology: HIE m/c (<24h onset), metabolic (hypoglycemia m/c, hypocalcemia 2nd in IDM), sepsis, bleeds, kernicterus, PVH/germinal matrix."},{"id":"PEDS-U065","ch":7,"n":9,"title":"Neonatal Seizures — Management and Pyridoxine Trial","sec":"Management · p34","qs":["PEDS-C7-121","PEDS-C7-122","PEDS-C7-123","PEDS-C7-124","PEDS-C7-125","PEDS-C7-126","PEDS-C7-127","PEDS-C7-128","PEDS-C7-129","PEDS-C7-130","PEDS-C7-131","PEDS-C7-132","PEDS-C7-133","PEDS-C7-134","PEDS-C7-135"],"guide":"Stabilize ABC + correct reversible (hypoglycemia <45 → 2mL/kg 10% dextrose). Drugs: phenobarbitone → phenytoin/levetiracetam → midazolam infusion; pyridoxine therapeutic trial ↑GABA via GAD + pyridoxal phosphate."},{"id":"PEDS-U066","ch":8,"n":1,"title":"Phases of Growth","sec":"Phases of Growth · p35","qs":["PEDS-C8-001","PEDS-C8-002","PEDS-C8-003","PEDS-C8-004","PEDS-C8-005","PEDS-C8-006","PEDS-C8-007","PEDS-C8-008","PEDS-C8-009","PEDS-C8-010","PEDS-C8-011","PEDS-C8-012","PEDS-C8-013","PEDS-C8-014","PEDS-C8-015","PEDS-C8-016"],"guide":"Prenatal: zygote <2wks, embryo 3-8wks, fetus >9wks. Perinatal 22wks gestation →7d after birth. Postnatal: newborn 0-28d (early 0-7d/late 7-28d), infancy 1st yr, toddler 1-3, preschool 3-6, school 6-12, adolescence 10-19 (early 10-13/mid 14-16/late 17-19)."},{"id":"PEDS-U067","ch":8,"n":2,"title":"Pubertal Changes — Sequence","sec":"Pubertal changes · p35","qs":["PEDS-C8-017","PEDS-C8-018","PEDS-C8-019","PEDS-C8-020","PEDS-C8-021","PEDS-C8-022","PEDS-C8-023","PEDS-C8-024","PEDS-C8-025","PEDS-C8-026","PEDS-C8-027","PEDS-C8-028","PEDS-C8-029","PEDS-C8-030"],"guide":"Females onset 8-13y: thelarche→pubarche→growth spurt (↑height)→menarche. Males 9-14y: ↑testis (Prader orchidometer beads)→↑penis→pubarche/voice/pubic hair/spermarche→growth spurt→axillary/facial hair."},{"id":"PEDS-U068","ch":8,"n":3,"title":"Tanner SMR — Females & Males","sec":"Tanner's SMR · p36","qs":["PEDS-C8-031","PEDS-C8-032","PEDS-C8-033","PEDS-C8-034","PEDS-C8-035","PEDS-C8-036","PEDS-C8-037","PEDS-C8-038","PEDS-C8-039","PEDS-C8-040","PEDS-C8-041","PEDS-C8-042","PEDS-C8-043","PEDS-C8-044","PEDS-C8-045","PEDS-C8-046","PEDS-C8-047","PEDS-C8-048"],"guide":"Tanner assesses puberty. Females: breast I prepubertal →V adult (areola flatten + nipple). Pubic hair I→V sparse straight→curly→dense→medial thigh. Males: testis I 3mL (<4)→V 25mL (>20), penis 2.5→>4.5cm; III darkening scrotal skin; pubic hair same both sexes."},{"id":"PEDS-U069","ch":8,"n":4,"title":"Laws of Growth — Pattern","sec":"Laws of Growth · p37","qs":["PEDS-C8-049","PEDS-C8-050","PEDS-C8-051","PEDS-C8-052","PEDS-C8-053","PEDS-C8-054","PEDS-C8-055","PEDS-C8-056","PEDS-C8-057","PEDS-C8-058"],"guide":"Cephalocaudal head→toe (in utero→after birth). Limbs distal→proximal (fingers→arms). Tissues: brain 90% by 2y, gonadal ↑puberty, lymphoid 4-8y rapid, skeletal steady→spurt→fusion 18y F /20-22y M."},{"id":"PEDS-U070","ch":8,"n":5,"title":"Anthropometry — Weight","sec":"Anthropometry · p37","qs":["PEDS-C8-059","PEDS-C8-060","PEDS-C8-061","PEDS-C8-062","PEDS-C8-063","PEDS-C8-064","PEDS-C8-065","PEDS-C8-066","PEDS-C8-067","PEDS-C8-068","PEDS-C8-069","PEDS-C8-070","PEDS-C8-071","PEDS-C8-072","PEDS-C8-073"],"guide":"Birth wt India 2.8-3kg; <2.5kg LBW. Loss 10% 1st wk (extracellular fluid). Regains by 10d (14d preterm). Gain: 20-40g/d up to 3m, 400g/m up to 1y, 2kg/y up to 7y, 3kg/y after. Doubles 5-6m, triples 1y, quadruples 2y."},{"id":"PEDS-U071","ch":8,"n":6,"title":"Length/Height and Arm Span","sec":"Length/Height · p38","qs":["PEDS-C8-074","PEDS-C8-075","PEDS-C8-076","PEDS-C8-077","PEDS-C8-078","PEDS-C8-079","PEDS-C8-080","   streak(){const t=store('pulse_peds_streak')||{n:0,day:''};return t;},
  bumpStreak(){const today=new Date().toISOString().slice(0,10);let s=this.streak();

};

    wrongList.push(q);
    fb.className='fb show bad';
    fb.innerHTML='❌ Answer: <b>'+escapeHtml(cur.opts[rightIdx].t)+'</b><br>'+escapeHtml(q.exp);
  }
  refreshStats();
  $('nextBtn').classList.remove('hidden');
}
function floatText(el,txt,color){
  const r=el.getBoundingClientRect(),s=document.createElement('div');
  s.className='float';s.textContent=txt;s.style.color=color;
  s.style.left=(r.left+r.width/2-24)+'px';s.style.top=(r.top-6+window.scrollY)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function nextQ(){idx++;if(idx>=order.length)finishUnit();else renderQ();}
function finishUnit(){
  const d=S.done;if(!d.includes(curUnit.id)){d.push(curUnit.id);S.done=d;}
  S.bumpStreak();
  const pct=Math.round(correct/order.length*100);
  $('dSub').textContent=curUnit.title+' · '+correct+'/'+order.length+' correct';
  $('dScore').textContent=correct+'/'+order.length;
  $('dXP').textContent='+'+xpGain;$('dAcc').textContent=pct+'%';
  const box=$('dRev');box.innerHTML='';
  if(wrongList.length){const h=document.createElement('p');h.className='sub';h.textContent='Review:';box.appendChild(h);}
  wrongList.forEach(q=>{
    const r=document.createElement('div');r.className='rev';
    r.innerHTML='❓ '+escapeHtml(q.q)+'<br>✅ <b>'+escapeHtml(q.opts[q.ans])+'</b> — '+escapeHtml(q.exp);
    box.appendChild(r);
  });
  show('unitdone');
}
function afterUnit(){nav.stack=['home','chapters','path'];render();}
function continueLearning(){
  const c=CHAPTERS.find(x=>x.live);
  if(!c)return;curCh=c.n;
  const us=unitsOf(c.n);
  const nxt=us.find(u=>unitState(u,us)==='current')||us[0];
  curUnit=nxt;nav.stack=['home'];openGuide(nxt);
}
function unlockAll(){S.unlock=true;render();}
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  const k=parseInt(e.key);
  if(k>=1&&k<=4&&!locked){const b=$('opts').children[k-1];if(b)b.click();}
  else if(e.key==='Enter'&&locked)nextQ();
});
render();
</script>
</body>
</html>
